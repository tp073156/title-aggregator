<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mashable Headlines (2022+)</title>
<style>
body { background-color: #fff; color: #000; font-family: sans-serif; padding: 20px; }
a { color: #000; text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { border-bottom: 2px solid #000; padding-bottom: 5px; }
ul { list-style-type: none; padding: 0; }
li { margin-bottom: 12px; }
</style>
</head>
<body>
<h1>Mashable Headlines (2022+)</h1>
<ul>
{% for article in articles %}
<li><a href="{{ article.link }}" target="_blank">{{ article.title }}</a></li>
{% else %}
<li>No articles found.</li>
{% endfor %}
</ul>
</body>
</html>
